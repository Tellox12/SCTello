- name: Aprovisionar servidor web básico con usuario administrador
  hosts: rocky_clients
  become: true

  vars:
    admin_usuario: webadmin
    admin_grupo: webadmins
    sitio_titulo: "Servidor de Emmanuel - Laboratorio Ansible"

  tasks:
    - name: Crear el grupo del administrador web
      ansible.builtin.group:
        name: "{{ admin_grupo }}"
        state: present

    - name: Crear el usuario administrador web
      ansible.builtin.user:
        name: "{{ admin_usuario }}"
        group: "{{ admin_grupo }}"
        shell: /bin/bash
        create_home: true
        comment: "Usuario administrador del sitio web (creado por Ansible)"

    - name: Instalar paquetes necesarios
      ansible.builtin.dnf:
        name:
          - httpd
          - vim
        state: present

    - name: Desplegar la página principal desde plantilla
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: "{{ admin_usuario }}"
        group: "{{ admin_grupo }}"
        mode: '0644'
      notify: Reiniciar httpd

    - name: Habilitar e iniciar httpd
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true

    - name: Abrir el puerto 80 en firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

  handlers:
    - name: Reiniciar httpd
      ansible.builtin.systemd:
        name: httpd
        state: restarted
